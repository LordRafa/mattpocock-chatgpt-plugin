name: Package Matt Pocock skills
on:
  schedule:
    - cron: '0 4 * * 1' # Monday 04:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/sync.yml'
permissions:
  contents: write
concurrency:
  group: mattpocock-plugin-release
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install converter dependency
        run: python -m pip install -r requirements.txt
      - name: Test converter
        run: python -m unittest discover -s tests -v
      - name: Clone original skills (read-only)
        run: git clone --depth 1 --single-branch --branch main https://github.com/mattpocock/skills.git "$RUNNER_TEMP/matt-skills"
      - name: Build ChatGPT plugin (temporary files only)
        id: build
        shell: bash
        run: |
          python -m scripts.build \
            --upstream "$RUNNER_TEMP/matt-skills" \
            --sha "$(git -C "$RUNNER_TEMP/matt-skills" rev-parse HEAD)" \
            --plugin-out "$RUNNER_TEMP/output/mattpocock-skills-chatgpt" \
            --dist "$RUNNER_TEMP/dist" \
            --state state/latest.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Publish release using exact upstream version
        if: steps.build.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
          ARCHIVE: ${{ steps.build.outputs.archive }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" --clobber
          else
            gh release create "$TAG" "$ARCHIVE" \
              --target "$GITHUB_SHA" \
              --title "Matt Pocock Skills ${TAG} (unofficial ChatGPT packaging)" \
              --notes "Automatically generated from https://github.com/mattpocock/skills. Original work by Matt Pocock, MIT licensed. ZIP includes attribution, LICENSE, and upstream commit metadata. Version exactly matches upstream."
          fi
      - name: Record only sync metadata (never commit skills)
        if: steps.build.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p state
          cp "$RUNNER_TEMP/dist/state.json" state/latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/latest.json
          git commit -m "chore: record packaged upstream v${{ steps.build.outputs.version }}"
          git push origin HEAD:main
